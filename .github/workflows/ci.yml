name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: plugin-packages
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/LICENSE
            dist/*.zip
          if-no-files-found: error
